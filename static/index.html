<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>样本库位占用与移库</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; background: #f9fafb; }
    main { max-width: 960px; margin: auto; }
    h1 { margin-bottom: .25rem; }
    h2 { margin-top: 2rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .4rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #e5e7eb; padding: .5rem .7rem; text-align: left; font-size: .92rem; }
    th { background: #f3f4f6; }
    button { padding: .4rem .8rem; cursor: pointer; border: 1px solid #6b7280; border-radius: 6px; background: #fff; }
    button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    input { padding: .4rem .5rem; border: 1px solid #9ca3af; border-radius: 6px; }
    .toolbar { display: flex; gap: .5rem; align-items: center; margin: .8rem 0; flex-wrap: wrap; }
    #message { padding: .7rem 1rem; border-radius: 6px; display: none; margin: .8rem 0; }
    #message.ok { display: block; background: #dcfce7; color: #166534; }
    #message.err { display: block; background: #fee2e2; color: #991b1b; }
    .muted { color: #6b7280; font-size: .85rem; }
    dialog { border: 1px solid #9ca3af; border-radius: 10px; padding: 1.4rem; width: min(560px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    .field { margin-bottom: .8rem; }
    .field label { display: inline-block; width: 5.5rem; }
    code { background: #f3f4f6; padding: 0 .25rem; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>样本库位占用与移库</h1>
  <p class="muted">同一冻存位置同一时刻只允许一个在库样本。移库冲突时样本保留在原位置；旧位释放与新位占用在同一事务内完成。</p>
  <div class="toolbar">
    <button class="primary" onclick="loadAll()">刷新</button>
    <span id="health" class="muted"></span>
  </div>
  <div id="message"></div>

  <h2>当前库位</h2>
  <table>
    <thead>
      <tr><th>冰柜</th><th>位置</th><th>样本编号</th><th>样本ID</th><th>状态</th><th>占用时间</th><th>操作</th></tr>
    </thead>
    <tbody id="locations"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
  </table>

  <h2>在库样本</h2>
  <table>
    <thead>
      <tr><th>样本编号</th><th>样本ID</th><th>当前库位</th><th>版本</th><th>操作</th></tr>
    </thead>
    <tbody id="samples"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
  </table>
</main>

<dialog id="moveDialog">
  <form method="dialog" onsubmit="return false;">
    <h3 style="margin-top:0">移库</h3>
    <p class="muted" id="moveContext"></p>
    <div class="field"><label>冰柜</label><input id="newFreezer" required></div>
    <div class="field"><label>位置</label><input id="newPosition" required></div>
    <div class="field"><label>版本号</label><input id="expectedVersion" type="number" style="width:7rem"></div>
    <div class="toolbar" style="justify-content:flex-end">
      <button value="cancel" onclick="document.getElementById('moveDialog').close()">取消</button>
      <button class="primary" onclick="submitRelocate()">提交移库</button>
    </div>
  </form>
</dialog>

<dialog id="historyDialog">
  <h3 style="margin-top:0">历次库位变化 <span class="muted" id="historySample"></span></h3>
  <table>
    <thead><tr><th>冰柜</th><th>位置</th><th>占用时间</th><th>释放时间</th><th>状态</th></tr></thead>
    <tbody id="historyBody"></tbody>
  </table>
  <div class="toolbar" style="justify-content:flex-end">
    <button onclick="document.getElementById('historyDialog').close()">关闭</button>
  </div>
</dialog>

<script>
const HEADERS = {'Content-Type': 'application/json', 'X-User-Id': 'web-admin', 'X-Role': 'admin'};
let moveTarget = null;

function showMessage(text, ok) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = ok ? 'ok' : 'err';
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || ('HTTP ' + response.status));
  return body;
}

function slot(freezer, position) {
  return freezer + '/' + position;
}

async function loadAll() {
  try {
    const [health, locations, samples] = await Promise.all([
      api('/health'),
      api('/api/locations'),
      api('/api/samples?status=stored'),
    ]);
    document.getElementById('health').textContent =
      '服务状态：' + health.status + '，共 ' + locations.items.length + ' 个被占库位';
    renderLocations(locations.items);
    renderSamples(samples.items, locations.items);
    showMessage('', true);
    document.getElementById('message').style.display = 'none';
  } catch (err) {
    showMessage('加载失败：' + err.message, false);
  }
}

function renderLocations(items) {
  const body = document.getElementById('locations');
  if (!items.length) {
    body.innerHTML = '<tr><td colspan="7" class="muted">暂无在占库位</td></tr>';
    return;
  }
  body.innerHTML = items.map(item => `
    <tr>
      <td>${item.freezer}</td>
      <td>${item.position}</td>
      <td>${item.sample_code || ''}</td>
      <td><code>${item.sample_id}</code></td>
      <td>${item.sample_status || ''}</td>
      <td class="muted">${item.occupied_at}</td>
      <td>
        <button onclick="openMove('${item.sample_id}', '${item.sample_code || ''}', '${item.freezer}', '${item.position}')">移库</button>
        <button onclick="openHistory('${item.sample_id}', '${item.sample_code || ''}')">历次变化</button>
      </td>
    </tr>`).join('');
}

function renderSamples(samples, locations) {
  const body = document.getElementById('samples');
  if (!samples.length) {
    body.innerHTML = '<tr><td colspan="5" class="muted">暂无在库样本</td></tr>';
    return;
  }
  body.innerHTML = samples.map(sample => `
    <tr>
      <td>${sample.data.sample_code || ''}</td>
      <td><code>${sample.id}</code></td>
      <td>${slot(sample.data.freezer, sample.data.position)}</td>
      <td>${sample.version}</td>
      <td>
        <button onclick="openMove('${sample.id}', '${sample.data.sample_code || ''}', '${sample.data.freezer}', '${sample.data.position}', ${sample.version})">移库</button>
        <button onclick="openHistory('${sample.id}', '${sample.data.sample_code || ''}')">历次变化</button>
      </td>
    </tr>`).join('');
}

function openMove(sampleId, sampleCode, freezer, position, version) {
  moveTarget = {sampleId, freezer, position, version};
  document.getElementById('moveContext').textContent =
    '样本 ' + (sampleCode || sampleId) + '：当前库位 ' + slot(freezer, position) +
    (version ? '（当前版本 ' + version + '，留空则自动使用最新版本）' : '');
  document.getElementById('newFreezer').value = '';
  document.getElementById('newPosition').value = '';
  document.getElementById('expectedVersion').value = version || '';
  document.getElementById('moveDialog').showModal();
}

async function submitRelocate() {
  const freezer = document.getElementById('newFreezer').value.trim();
  const position = document.getElementById('newPosition').value.trim();
  const versionRaw = document.getElementById('expectedVersion').value;
  if (!freezer || !position) {
    showMessage('请填写目标冰柜和位置', false);
    return;
  }
  const payload = {action: 'relocate', data: {freezer, position}};
  if (versionRaw) payload.expected_version = Number(versionRaw);
  try {
    await api('/api/entities/' + moveTarget.sampleId + '/actions', {
      method: 'POST', headers: HEADERS, body: JSON.stringify(payload),
    });
    document.getElementById('moveDialog').close();
    showMessage('移库成功：' + moveTarget.freezer + '/' + moveTarget.position + ' → ' + slot(freezer, position), true);
    await loadAll();
  } catch (err) {
    // 目标位置被占：接口返回 409，页面保留原库位并展示冲突说明
    showMessage('移库失败：' + err.message, false);
  }
}

async function openHistory(sampleId, sampleCode) {
  document.getElementById('historySample').textContent = sampleCode || sampleId;
  const body = document.getElementById('historyBody');
  body.innerHTML = '<tr><td colspan="5" class="muted">加载中…</td></tr>';
  document.getElementById('historyDialog').showModal();
  try {
    const result = await api('/api/entities/' + sampleId + '/locations');
    if (!result.items.length) {
      body.innerHTML = '<tr><td colspan="5" class="muted">暂无库位记录</td></tr>';
      return;
    }
    body.innerHTML = result.items.map(item => `
      <tr>
        <td>${item.freezer}</td>
        <td>${item.position}</td>
        <td class="muted">${item.occupied_at}</td>
        <td class="muted">${item.released_at || '—'}</td>
        <td>${item.active ? '在库' : '已释放'}</td>
      </tr>`).join('');
  } catch (err) {
    body.innerHTML = '<tr><td colspan="5">' + err.message + '</td></tr>';
  }
}

loadAll();
</script>
</body>
</html>
