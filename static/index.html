<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生物样本库知情同意与撤回</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    input { padding: .5rem; min-width: 18rem; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
    th, td { border: 1px solid #d1d5db; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f3f4f6; }
    .empty { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>生物样本库知情同意与撤回</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>

  <h2>库位占用</h2>
  <p><button onclick="loadPositions()">刷新库位</button></p>
  <div id="positions" class="empty">尚未加载</div>

  <h2>样本库位查询</h2>
  <p>
    <input id="sampleId" placeholder="样本 ID">
    <button onclick="lookupSample()">查询当前库位与历次变化</button>
  </p>
  <div id="sample"></div>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
GET  /api/positions
GET  /api/audit?entity_id=&lt;id&gt;</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

function renderTable(container, columns, rows, emptyText) {
  if (!rows.length) {
    container.innerHTML = '<p class="empty">' + emptyText + '</p>';
    return;
  }
  const head = columns.map(c => '<th>' + c.label + '</th>').join('');
  const body = rows.map(row =>
    '<tr>' + columns.map(c => '<td>' + (c.render ? c.render(row) : (row[c.key] ?? '')) + '</td>').join('') + '</tr>'
  ).join('');
  container.innerHTML = '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
}

async function loadPositions() {
  const container = document.getElementById('positions');
  const response = await fetch('/api/positions');
  const payload = await response.json();
  renderTable(container, [
    { key: 'freezer', label: '冰箱' },
    { key: 'position', label: '库位' },
    { key: 'sample_id', label: '在库样本' },
    { key: 'occupied_at', label: '占用时间' },
  ], payload.items || [], '当前没有被占用的库位');
}

async function lookupSample() {
  const container = document.getElementById('sample');
  const id = document.getElementById('sampleId').value.trim();
  if (!id) {
    container.innerHTML = '<p class="empty">请输入样本 ID</p>';
    return;
  }
  const response = await fetch('/api/entities/' + encodeURIComponent(id));
  const payload = await response.json();
  if (!response.ok) {
    container.innerHTML = '<p class="empty">' + (payload.error || '查询失败') + '</p>';
    return;
  }
  const data = payload.data || {};
  const current = '<p>当前状态：<b>' + payload.status + '</b>　当前库位：<b>' +
    (data.freezer ? data.freezer + ' / ' + data.position : '未入库') + '</b></p>';
  const history = document.createElement('div');
  container.innerHTML = current;
  container.appendChild(history);
  renderTable(history, [
    { label: '原库位', render: h => (h.from_freezer ?? '-') + ' / ' + (h.from_position ?? '-') },
    { label: '新库位', render: h => h.to_freezer + ' / ' + h.to_position },
    { key: 'changed_at', label: '变更时间' },
    { key: 'changed_by', label: '操作人' },
  ], data.position_history || [], '没有移库记录');
}
</script>
</body>
</html>
